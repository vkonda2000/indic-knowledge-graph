# Source registry. Every passage in the corpus carries its work, translator and source URL,
# so answers can always be traced back to a specific public-domain edition.
#
# Each entry is one edition (translation) of a work (text). `id` is the registry key and, by
# default, the work id that filters, gazetteer scoping and graph weights use. `edition` names
# the translation; it must be unique. To add a second translation of a text already here, give
# it its own `id` and `edition` and set `work:` to the existing work id (docs/02 D10).
#
# To add a work: add an entry here and a parser in ikg/segment.py (keyed by `parser`).
# Each Gutenberg file is pinned by `sha256`: `ikg fetch` and `ikg build` refuse a file whose
# contents differ, so a re-edited upstream text can't silently change passages or eval results.
# Every pinned file must also be an asset of the `pinned-sources-v1` GitHub release, which CI and
# new clones download from (Gutenberg re-issues texts in place). When you add or repin a file,
# upload it there (`gh release upload pinned-sources-v1 data/raw/pg<n>.txt`).

works:
  - id: upanishads
    edition: paramananda-1919
    title: The Upanishads (Isa, Katha, Kena)
    translator: Swami Paramananda
    year: 1919
    parser: upanishads
    files:
      - gutenberg: 3283
        sha256: 2ffc941173d8fd10c16eea7bfb4ab2ace13cf9e734228c71f367402f9236aa46
    notes: >
      Each verse is followed by the translator's commentary. The parser separates
      verse text (kind=verse) from commentary (kind=commentary) and introductions.

