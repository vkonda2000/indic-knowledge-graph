# Source registry. Every passage in the corpus carries its work, translator and source URL,
# so answers can always be traced back to a specific public-domain edition.
#
# To add a work: add an entry here and a parser in ikg/segment.py (keyed by `parser`).

works:
  - id: upanishads
    title: The Upanishads (Isa, Katha, Kena)
    translator: Swami Paramananda
    year: 1919
    parser: upanishads
    files:
      - gutenberg: 3283
    notes: >
      Each verse is followed by the translator's commentary. The parser separates
      verse text (kind=verse) from commentary (kind=commentary) and introductions.

  - id: mahabharata
    title: The Mahabharata of Krishna-Dwaipayana Vyasa
    translator: Kisari Mohan Ganguli
    year: 1883-1896
    parser: mahabharata
    files:
      - gutenberg: 15474   # Books 1-3
      - gutenberg: 15475   # Books 4-7
      - gutenberg: 15476   # Books 8-12
      - gutenberg: 15477   # Books 13-18

  - id: ramayana
    title: The Ramayan of Valmiki, translated into English verse
    translator: Ralph T. H. Griffith
    year: 1870-1874
    parser: ramayana
    files:
      - gutenberg: 24869

  - id: vishnu_purana
    title: A Prose English Translation of Vishnupuranam
    translator: Manmatha Nath Dutt (after H. H. Wilson)
    year: 1896
    parser: vishnu_purana
    files:
      - gutenberg: 66208
    notes: >
      The only Purana currently on Project Gutenberg. Candidates to add from other
      public-domain editions (verify license first): Bhagavata Purana (M. N. Dutt, 1895),
      Markandeya Purana (F. E. Pargiter, 1904), Garuda Purana (Wood & Subrahmanyam, 1911).
