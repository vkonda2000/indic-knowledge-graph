  - {id: shakuni, type: Person, label: Shakuni, iast: śakuni, aliases: [shakuni, sakuni]}
  - {id: abhimanyu, type: Person, label: Abhimanyu, iast: abhimanyu, aliases: [abhimanyu]}
  - {id: pandu, type: Person, label: Pandu, iast: pāṇḍu, aliases: [pandu]}

  # ---------------- Persons: across texts ----------------
  - {id: narada, type: Person, label: Narada, iast: nārada, aliases: [narada, narad]}
  - {id: vasishtha, type: Person, label: Vasishtha, iast: vasiṣṭha, aliases: [vasishtha, vasistha, vasishta]}
