  - {id: arjuna, type: Person, label: Arjuna, iast: arjuna, aliases: [arjuna, partha, dhananjaya, phalguna]}
  - {id: yudhishthira, type: Person, label: Yudhishthira, iast: yudhiṣṭhira, aliases: [yudhishthira]}
  - {id: bhima, type: Person, label: Bhima, iast: bhīma, aliases: [bhima, bhimasena, vrikodara]}
  - {id: nakula, type: Person, label: Nakula, iast: nakula, aliases: [nakula]}
  - {id: sahadeva, type: Person, label: Sahadeva, iast: sahadeva, aliases: [sahadeva]}
  - {id: draupadi, type: Person, label: Draupadi, iast: draupadī, aliases: [draupadi, panchali, yajnaseni]}
  - {id: kunti, type: Person, label: Kunti, iast: kuntī, aliases: [kunti, pritha]}
  - {id: bhishma, type: Person, label: Bhishma, iast: bhīṣma, aliases: [bhishma, devavrata]}
  - {id: drona, type: Person, label: Drona, iast: droṇa, aliases: [drona]}
  - {id: karna, type: Person, label: Karna, iast: karṇa, aliases: [karna, radheya]}
