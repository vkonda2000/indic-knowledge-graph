[project]
name = "indic-knowledge-graph"
version = "0.1.0"
description = "Ontology, knowledge graph and source-grounded QA over the Upanishads, Mahabharata, Ramayana and Puranas"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "networkx>=3.0",
    "rdflib>=7.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pypdf>=6.0",  # the build reads PDF uploads; 6.x limits decompression per stream
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
# fastembed is pinned exactly: vectors are reused across builds only if the library version matches
# (embed.reusable_embeddings), and the published seed vectors were made with this version.
embed = ["fastembed==0.9.1", "numpy>=1.24"]  # dense embeddings at build time (docs/08 A1)
pg = ["psycopg[binary]>=3.2", "pgvector>=0.4", "numpy>=1.24"]  # the Postgres vector store (docs/08 A2)
# The MCP server (docs/08 B1): the official MCP Python SDK, v2, which needs Python 3.11+.
mcp = ["mcp>=2.3,<3; python_version >= '3.11'", "uvicorn>=0.29"]
dev = ["pytest>=7.0", "httpx>=0.27", "numpy>=1.24"]  # tests use a fake embedder, never a model

[project.scripts]
ikg = "ikg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ikg = ["data/*.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
