# Local stack: Postgres with pgvector (docs/08 A2) and the IKG app (docs/08 §E, local image).
#
#   docker compose up -d db                 # the database only, for `ikg` on the host:
#   IKG_VECTOR_STORE=postgresql://ikg:ikg@127.0.0.1:5433/ikg ikg vectors compare
#
#   docker compose up -d --build            # database + app; site at http://127.0.0.1:8000
#   docker compose exec app ikg vectors compare
#
# Local development only: the password is a default and both ports are bound to 127.0.0.1.
# The app serves the corpus built on the host (./data, mounted), so run `ikg build --embed` there
# first. On Linux, ./data must be writable by uid 1000 (`sudo chown -R 1000:1000 data`), or the
# container can serve but not rebuild, upload or log provenance. The vector table is a copy of
# the build's embeddings, reloaded when the build changes, so the db volume can be deleted any time.
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ikg
      POSTGRES_PASSWORD: ${IKG_PG_PASSWORD:-ikg}
      POSTGRES_DB: ikg
    ports:
      - "127.0.0.1:${IKG_PG_PORT:-5433}:5432"  # 5433: a local Postgres often has 5432
    volumes:
      - ikg-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikg -d ikg"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: ikg-app:local
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env          # ANTHROPIC_API_KEY, IKG_ADMIN_TOKEN, limits; optional
        required: false
    environment:
      IKG_DATA: /app/data
      IKG_VECTOR_STORE: postgresql://ikg:${IKG_PG_PASSWORD:-ikg}@db:5432/ikg
      IKG_EMBED: "on"  # an admin Rebuild keeps the embeddings (minutes, not seconds)
      OLLAMA_HOST: http://host.docker.internal:11434  # upload screening uses Ollama on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Docker Engine on Linux; Docker Desktop has it already
    volumes:
      - ./data:/app/data
      - ikg-models:/home/ikg/.cache  # the embedding model, downloaded on the first Rebuild
    ports:
      - "127.0.0.1:${IKG_APP_PORT:-8000}:8000"

  # The corpus as MCP tools over Streamable HTTP (docs/08 B1), for Claude, ChatGPT or another MCP client.
  # Opt in: set IKG_MCP_TOKEN (16+ random characters) in .env, then `docker compose --profile mcp up -d mcp`.
  mcp:
    profiles: ["mcp"]
    image: ikg-app:local
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      IKG_DATA: /app/data
      IKG_VECTOR_STORE: postgresql://ikg:${IKG_PG_PASSWORD:-ikg}@db:5432/ikg
      OLLAMA_HOST: http://host.docker.internal:11434
      IKG_MCP_TOKEN: ${IKG_MCP_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ikg-models:/home/ikg/.cache
    command: ["ikg", "mcp", "--http", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:  # the image's check is for the web app on 8000; this one only asks whether 8001 accepts
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    ports:
      - "127.0.0.1:${IKG_MCP_PORT:-8001}:8001"

volumes:
  ikg-pg:
  ikg-models:
