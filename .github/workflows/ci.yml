# Runs on every pull request and on pushes to main.
#   tests     - pytest on the oldest and newest supported Python (no network, no API key)
#   eval-gate - builds the full corpus and fails if offline retrieval metrics drop below
#               eval/baseline.json (see docs/06-roadmap.md, Phase 0)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[web,dev]"
      - run: pytest -q

  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # The texts are pinned by sha256 in the source registry, so cache them on it rather than
      # downloading about 18 MB on every run. The cache is saved right after a verified fetch,
      # so a later failure in the build or the gate doesn't force the next run to download again.
      - id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: gutenberg-${{ hashFiles('src/ikg/data/sources.yaml') }}
      - run: ikg fetch
      - if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: gutenberg-${{ hashFiles('src/ikg/data/sources.yaml') }}
      - run: ikg build
      - run: ikg eval --check eval/baseline.json
