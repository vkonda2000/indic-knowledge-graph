# Runs on every pull request and on pushes to main.
#   tests     - pytest on the oldest and newest supported Python (no network, no API key)
#   image     - builds the app image and checks a container serves the home page
#   pgvector  - the Postgres vector store tests, against a pgvector service container
#   eval-gate - takes the pinned source texts from the pinned-sources-v1 release (not gutenberg.org),
#               builds the full corpus with embeddings (cached between runs), and fails if hybrid
#               retrieval metrics drop below eval/baseline.json (see docs/06-roadmap.md, Phase 0)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[web,dev]"
      - run: pytest -q

  # The app image builds and a container serves the home page (with no corpus mounted).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ikg-app:ci .
      - run: docker run -d --name ikg -p 127.0.0.1:8000:8000 ikg-app:ci
      - run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ | grep -q "not been built"; then exit 0; fi
            sleep 1
          done
          docker logs ikg
          exit 1

  # The Postgres vector store against a real pgvector (docs/08 A2). The tests above skip these.
  pgvector:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: ikg
          POSTGRES_PASSWORD: ikg
          POSTGRES_DB: ikg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ikg -d ikg" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[web,dev,pg]"
      - run: pytest -q tests/test_vectorstore.py
        env:
          IKG_TEST_PG_DSN: postgresql://ikg:ikg@127.0.0.1:5432/ikg

  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # a cold run embeds all passages (~10 min); cached runs reuse the vectors
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[embed]"
      # The texts are pinned by sha256 in the source registry, so cache them on it rather than
      # downloading about 18 MB on every run. The cache is saved right after a verified fetch,
      # so a later failure in the build or the gate doesn't force the next run to download again.
      - id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: gutenberg-${{ hashFiles('src/ikg/data/sources.yaml') }}
      # Gutenberg re-issues texts in place (pg15474 and pg15475 changed in November 2026), and a
      # changed text changes frozen passage IDs (D11). So on a cache miss, take the exact pinned
      # copies from this repo's release instead; `ikg fetch` then verifies each one against its pin.
      - if: steps.raw-cache.outputs.cache-hit != 'true'
        run: gh release download pinned-sources-v1 --dir data/raw --pattern 'pg*.txt'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ikg fetch
      - if: steps.raw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: gutenberg-${{ hashFiles('src/ikg/data/sources.yaml') }}
      # The default retriever is hybrid, so the gate needs embeddings. The build reuses cached vectors
      # when the model, library and every passage's text are unchanged (embed.reusable_embeddings), so
      # a stale cache is safe: it is re-embedded. Both caches are saved right after the build, so a
      # failing gate doesn't make the next push embed everything again.
      - id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .fastembed-cache
          key: fastembed-bge-small-en-v1.5
      - id: vector-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed/embeddings.npy
            data/processed/embeddings.json
          key: embeddings-${{ hashFiles('src/ikg/data/sources.yaml', 'src/ikg/segment.py', 'src/ikg/sources.py', 'src/ikg/normalize.py', 'src/ikg/embed.py', 'pyproject.toml') }}
          restore-keys: embeddings-
      - run: ikg build --embed
      - if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .fastembed-cache
          key: fastembed-bge-small-en-v1.5
      - if: steps.vector-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/processed/embeddings.npy
            data/processed/embeddings.json
          key: embeddings-${{ hashFiles('src/ikg/data/sources.yaml', 'src/ikg/segment.py', 'src/ikg/sources.py', 'src/ikg/normalize.py', 'src/ikg/embed.py', 'pyproject.toml') }}
      - run: ikg eval --check eval/baseline.json
